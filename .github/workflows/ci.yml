name: ci

on:
  pull_request:
    branches:
      - main
      - phase-1-closure-**
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint / typecheck / unit / api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.18
      - name: Install dependencies
        run: uv sync --frozen
      - name: Backend lint and typecheck
        run: bash scripts/ci/backend-lint.sh
      - name: Backend unit and API tests
        env:
          PYTEST_ADDOPTS: "--tb=no --assert=plain"
        run: bash scripts/ci/backend-test.sh

  frontend:
    name: frontend tests / playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.18
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Frontend lint, typecheck, unit tests, build
        run: bash scripts/ci/frontend-build.sh
      - name: Playwright smoke
        run: bash scripts/ci/frontend-smoke.sh
      - name: Heartbeat 1 browser restart evidence
        run: bash scripts/ci/heartbeat1-browser.sh
      - name: Upload Heartbeat 1 zero-match evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heartbeat1-browser-evidence
          path: reports/heartbeat1/published
          if-no-files-found: error
          retention-days: 7
      - name: Heartbeat 2 trusted browser evidence
        if: ${{ hashFiles('scripts/ci/heartbeat2-browser.sh') != '' }}
        env:
          NARRATWIN_H2_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/heartbeat2-browser.sh
      - name: Upload Heartbeat 2 minimized withheld diagnostic
        if: failure() && hashFiles('reports/heartbeat2/withheld/diagnostic.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heartbeat2-withheld-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/heartbeat2/withheld/diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify Heartbeat 2 CI execution binding
        if: success() && hashFiles('scripts/ci/heartbeat2-browser.sh') != ''
        env:
          NARRATWIN_H2_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: jq -e '.outcome == "CI_EXECUTION_BOUND" and .executionAuthenticity == "GITHUB_ACTIONS" and .headSha == env.NARRATWIN_H2_EXPECTED_HEAD and .githubRunId == env.GITHUB_RUN_ID and .githubRunAttempt == env.GITHUB_RUN_ATTEMPT' reports/heartbeat2/published/ci-verification.json
      - name: Upload Heartbeat 2 trusted evidence
        if: success() && hashFiles('scripts/ci/heartbeat2-browser.sh') != '' && hashFiles('reports/heartbeat2/published/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heartbeat2-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/heartbeat2/published
          if-no-files-found: error
          retention-days: 7

  docker:
    name: ci / docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Docker build
        run: bash scripts/ci/docker-build.sh

  stage8-budgets:
    name: stage8 / performance lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read active stage
        id: active-stage
        run: echo "stage=$(cat .stage/current)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.active-stage.outputs.stage == '8'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.active-stage.outputs.stage == '8'
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        if: steps.active-stage.outputs.stage == '8'
        run: python -m pip install uv==0.11.18
      - name: Install backend dependencies
        if: steps.active-stage.outputs.stage == '8'
        run: uv sync --frozen
      - name: Stage 8 API performance smoke
        if: steps.active-stage.outputs.stage == '8'
        run: bash scripts/ci/performance-smoke.sh
      - name: Stage 8 frontend Lighthouse
        if: steps.active-stage.outputs.stage == '8'
        run: bash scripts/ci/frontend-lighthouse.sh
      - name: Upload Stage 8 performance and Lighthouse reports
        if: always() && steps.active-stage.outputs.stage == '8'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage8-performance-lighthouse-reports
          path: |
            reports/performance
            reports/lighthouse
          if-no-files-found: error
          retention-days: 7
