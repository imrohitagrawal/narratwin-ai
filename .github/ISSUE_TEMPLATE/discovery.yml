{
  "name": "Discovery / feature / design question",
  "description": "Explore a problem, a new product or a design decision before committing to implementation.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Search existing work first. Use public-safe evidence only; never paste secrets, customer data or private session logs. This issue records a request, not execution authority."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Who has the problem, and what happens today?",
        "description": "Describe the affected person, journey and available observations; a new product may have no current implementation."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "decision",
      "attributes": {
        "label": "What decision or outcome should this investigation produce?",
        "description": "State the question and what evidence would help decide. Do not invent implementation approval."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "unknowns",
      "attributes": {
        "label": "What is unknown, and what will we investigate next?",
        "description": "List assumptions, alternatives and a bounded next investigation."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Existing work, design and sources",
        "description": "Link the work record, designs or PRD if they exist; none yet is valid for a new product."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "ownership",
      "attributes": {
        "label": "Who owns the next decision or dependency?",
        "description": "Name a known owner/dependency, or say unassigned for maintainer triage."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
